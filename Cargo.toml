[package]
name = "beamline"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "LGPL-3.0-only"

[dependencies]
adw = { package = "libadwaita", version = "0.9", features = ["v1_10"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_24"] }
gettext-rs = { version = "0.7", features = ["gettext-system"] }
